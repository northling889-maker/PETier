let globalTooltip = null;

function computeRanks(sortedList) {
    const map = new Map();
    let prevScore = null;
    let prevRank  = 0;

    sortedList.forEach((p, index) => {
        const score = Number(p.total) || 0;
        const rank = (prevScore !== null && score === prevScore)
            ? prevRank
            : (index + 1);
        prevScore = score;
        prevRank  = rank;
        map.set(p.id, rank);
    });

    return map;
}

function getTierPoints(tier) {

let tooltipSlot = null;

function deviceHasHover() {
    return !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);

function getOrCreateTooltip() {
    if (!globalTooltip) {
        globalTooltip = document.createElement('div');
        globalTooltip.className = 'tier-tooltip';
        globalTooltip.innerHTML = `
            <span class="tt-tier"></span>
            <span class="tt-points"></span>
            <span class="tt-arrow"></span>`;
        document.body.appendChild(globalTooltip);
    }
    return globalTooltip;
}

function findTierSlot(el) {
    if (!el || typeof el.closest !== 'function') return null;
    const slot = el.closest('.tier-slot, .detail-tier-slot');
    if (!slot || slot.classList.contains('empty')) return null;
    const tier = slot.dataset.tier;
    if (!tier || tier === '-') return null;
    return slot;
}

function isTooltipShown() {
    return !!globalTooltip && globalTooltip.classList.contains('show');
}

function showTierTooltipForSlot(slot) {
    const tier = slot && slot.dataset.tier;
    if (!tier || tier === '-') return;

    const peak = slot.dataset.peak || '-';
    const hasDistinctPeak = peak && peak !== '-' && peak !== tier;
    const countedTier = hasDistinctPeak ? peak : tier;
    const points = getTierPoints(countedTier);

    const tip = getOrCreateTooltip();
    const tierEl = tip.querySelector('.tt-tier');

    let displayTier = tier;
    if (hasDistinctPeak) {
        displayTier = 'Peak ' + peak;
    } else if (isRetiredTier(tier)) {
        displayTier = 'Retired ' + tier.replace(/^R/i, '');
    }

    tierEl.textContent = displayTier;
    tierEl.style.color = '#ffffff'; // 全部统一为白色，不加任何颜色

    tip.querySelector('.tt-points').textContent = `${points} points`;

    tooltipSlot = slot;
    tip.classList.add('show');
    positionTooltip(slot);
}

function positionTooltip(target) {
    if (!globalTooltip) return;
    const rect = target.getBoundingClientRect();
    const tipRect = globalTooltip.getBoundingClientRect();

    let left = rect.left + rect.width / 2 - tipRect.width / 2;
    let top = rect.top - tipRect.height - 12;
    let below = false;

    if (left < 8) left = 8;
    if (left + tipRect.width > window.innerWidth - 8) {
        left = window.innerWidth - tipRect.width - 8;
    }

    if (top < 8) {
        top = rect.bottom + 12;
        below = true;
    }

    globalTooltip.style.left = left + 'px';
    globalTooltip.style.top = top + 'px';
    globalTooltip.classList.toggle('below', below);
}

function hideTierTooltip() {
    tooltipSlot = null;
    if (globalTooltip) globalTooltip.classList.remove('show');
}

function initGlobalTooltipEvents() {
    document.addEventListener('pointerover', (e) => {
        if (e.pointerType !== 'mouse') return;
        const slot = findTierSlot(e.target);
        if (!slot) return;
        if (e.relatedTarget && slot.contains(e.relatedTarget)) return;
        showTierTooltipForSlot(slot);
    });
    document.addEventListener('pointerout', (e) => {
        if (e.pointerType !== 'mouse') return;
        const slot = (e.target && typeof e.target.closest === 'function')
            ? e.target.closest('.tier-slot, .detail-tier-slot') : null;
        if (!slot) return;
        if (e.relatedTarget && slot.contains(e.relatedTarget)) return;
        hideTierTooltip();
    });

    document.addEventListener('click', (e) => {
        if (deviceHasHover()) return;
        const slot = (e.target && typeof e.target.closest === 'function')
            ? e.target.closest('#detailModal .detail-tier-slot') : null;
        const valid = slot && !slot.classList.contains('empty')
            && slot.dataset.tier && slot.dataset.tier !== '-';
        if (valid) {
            if (tooltipSlot === slot && isTooltipShown()) hideTierTooltip();
            else showTierTooltipForSlot(slot);
            return;
        }
        hideTierTooltip();
    });

    window.addEventListener('scroll', hideTierTooltip, true);
    window.addEventListener('resize', hideTierTooltip);
}

function readModeTierData(player, mode) {
    if (!player || !player.tiers || !player.tiers[mode]) {
        return { tier: '-', peak: '-' };
    }
    const obj = player.tiers[mode];
    const tier = (obj.tier && obj.tier !== '') ? obj.tier : '-';
    const peakRaw = (obj.peak && obj.peak !== '') ? obj.peak : '';
    const peak = peakRaw || tier;
    return { tier, peak };
}

function getModeTier(player, mode) {

}

function getModePeak(player, mode) {

function buildTooltipInfo(tier, peak) {
    if (!tier || tier === '-') return null;

    const hasDistinctPeak = peak && peak !== '-' && peak !== tier;
    if (hasDistinctPeak) {
        return {
            name: 'Peak ' + peak,
            points: getTierPoints(peak),
            colorTier: peak
        };
    }
    return {

function getTopModes(player, count = TOP_MODES_COUNT) {
    const items = MODES.map((m, idx) => {
        const { tier, peak } = readModeTierData(player, m);
        return { mode: m, tier, peak, modeIndex: idx };
    });
    items.sort((a, b) => {
        const ra = TIER_ORDER[a.tier] ?? 999;
        const rb = TIER_ORDER[b.tier] ?? 999;
        if (ra !== rb) return ra - rb;
        return a.modeIndex - b.modeIndex;
    });
    return items.slice(0, count);
}

const premiumCache = {};
const premiumPending = new Map();

async function checkPremium(name) {
    if (!name) return false;
    if (premiumCache[name] !== undefined) return premiumCache[name];
    if (premiumPending.has(name)) return premiumPending.get(name);
    const promise = (async () => {
        try {
            const url = `https://visage.surgeplay.com/bust/32/${encodeURIComponent(name)}`;
            const res = await fetch(url, { method: 'GET', cache: 'default' });
            return res.ok;
        } catch (e) { return false; }
    })();
    premiumPending.set(name, promise);
    const result = await promise;
    premiumCache[name] = result;
    premiumPending.delete(name);
    return result;
}

let activeAvatarFetches = 0;
const avatarFetchQueue = [];

function pumpAvatarFetchQueue() {
    while (activeAvatarFetches < AVATAR_FETCH_CONCURRENCY && avatarFetchQueue.length > 0) {
        const job = avatarFetchQueue.shift();
        activeAvatarFetches++;
        Promise.resolve()
            .then(job.fn)
            .catch(() => false)
            .then((result) => {
                activeAvatarFetches--;
                job.resolve(result);
                pumpAvatarFetchQueue();
            });
    }
}

function withAvatarSlot(fn) {
    return new Promise((resolve) => {
        avatarFetchQueue.push({ fn, resolve });
        pumpAvatarFetchQueue();
    });
}

let avatarObserver = null;

function initAvatarObserver() {
    if (avatarObserver || typeof IntersectionObserver === 'undefined') return;
    avatarObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            const img = entry.target;
            avatarObserver.unobserve(img);
            applyAvatarToImg(img);
        }
    }, { rootMargin: AVATAR_ROOT_MARGIN });
}

async function applyAvatarToImg(img) {
    if (!img || img.dataset.avatarApplied === '1') return;
    img.dataset.avatarApplied = '1';

    const name = img.dataset.skinName;
    if (!name) return;
    img.removeAttribute('data-skin-name');

    const fallbackUrl = getOfflineFallbackUrl();
    const isPremium = await withAvatarSlot(() => checkPremium(name));
    if (!isPremium) {
        img.src = fallbackUrl;
        return;
    }
    img.onerror = function () { this.onerror = null; this.src = fallbackUrl; };
    img.src = buildSkinUrl(name);
}

function hydrateAvatars(container) {
    if (!container) return;
    const imgs = container.querySelectorAll('img.lazy-avatar[data-skin-name]');
    if (!imgs.length) return;

    if (typeof IntersectionObserver === 'undefined') {
        imgs.forEach(applyAvatarToImg);
        return;
    }
    if (!avatarObserver) initAvatarObserver();
    imgs.forEach(img => avatarObserver.observe(img));
}

function buildSkinUrl(name) {
    const clean = (name && String(name).trim()) || OFFLINE_FALLBACK_NAME;
    return `https://visage.surgeplay.com/bust/${SKIN_RENDER_SIZE}/${encodeURIComponent(clean)}?yaw=${SKIN_YAW}&pitch=${SKIN_PITCH}&aa=true`;

async function hydrateSingleAvatar(imgEl, player) {
    if (!imgEl) return;
    const customAvatar = player && player.customAvatar;
    if (customAvatar && customAvatar.startsWith('data:image')) {
        imgEl.onerror = function () { this.onerror = null; this.src = STEVE_AVATAR; };
        imgEl.src = customAvatar;
        return;
    }
    const clean = cleanPlayerName(player && player.name);
    const fallbackUrl = getOfflineFallbackUrl();
    imgEl.onerror = function () { this.onerror = null; this.src = fallbackUrl; };
    imgEl.src = fallbackUrl;
    if (!clean) return;

    const isPremium = await withAvatarSlot(() => checkPremium(clean));
    if (!isPremium) return;
    if (currentViewPlayer !== player) return;
    imgEl.onerror = function () { this.onerror = null; this.src = fallbackUrl; };
    imgEl.src = buildSkinUrl(clean);
}

function getTierLevel(tier) {
    const m = String(tier).match(/T([1-5])/i);
    return m ? Number(m[1]) : null;
}
function isHighTier(tier) { return /^(?:R?HT[1-2]|P?HT[1-3]|HT[1-5])$/i.test(String(tier)); }

function calcTotal(player) {
    let sum = 0;
    MODES.forEach(m => {
        const t = getModePeak(player, m);
        if (t && t !== '-') {
            sum += Number(TIER_SCORE[t] ?? 0);
        }
    });
    return Math.floor(Number(sum));
}

function getTierInfo(rawTotal) {
    const total = Number(rawTotal) || 0;
    if (total >= 800) return { name: "Combat Grandmaster", cls: "text-grandmaster" };
    if (total >= 500) return { name: "Combat Master",      cls: "text-master" };
    if (total >= 200) return { name: "Combat Ace",         cls: "text-ace" };
    if (total >= 100) return { name: "Combat Specialist",  cls: "text-specialist" };
    if (total >= 40)  return { name: "Combat Cadet",       cls: "text-cadet" };
    if (total >= 20)  return { name: "Combat Novice",      cls: "text-novice" };
    return { name: "Rookie", cls: "text-rookie" };
}

function getTierBucketPlayers(players, mode, tierNum) {
    const excludedTiers = ["RHT1", "RLT1", "RHT2", "RLT2"];
    return players.filter(p => {
        const tier = getModeTier(p, mode);
        if (excludedTiers.includes(tier)) return false;
        return getTierLevel(tier) === tierNum;
    }).sort((a, b) => {
        const ta = getModeTier(a, mode), tb = getModeTier(b, mode);
        const sa = TIER_SCORE[ta] ?? 0, sb = TIER_SCORE[tb] ?? 0;
        if (sa !== sb) return sb - sa;
        return String(a.name).localeCompare(String(b.name));
    });
}
function applySearch(data) {
    if (searchKeyword.trim() === "") return data;
    const kw = searchKeyword.toLowerCase().trim();
    return data.filter(item =>
        String(item.name || "").toLowerCase().includes(kw) ||
        String(item.region || "").toLowerCase().includes(kw)
    );
}

function renderTable() {
    const container = document.getElementById("playerTableBody");
    if (activeTierPage !== "all") { renderModePage(activeTierPage); return; }

    let fullData = playerList.filter(item => item && item.name).map(item => {
        const rawTotal = calcTotal(item);
        return { ...item, total: Math.max(0, rawTotal) };
    });
    fullData.sort((a, b) => b.total - a.total);

    rankMap = computeRanks(fullData);

    const topData = fullData.slice(0, OVERALL_LIMIT);
    filteredCache = applySearch(topData);

    container.innerHTML = '';
    renderedCount = 0;
    if (sentinelObserver) { sentinelObserver.disconnect(); sentinelObserver = null; }

    if (filteredCache.length === 0) {
        container.innerHTML = `<div class="empty-tip"><i class="fa-solid fa-magnifying-glass mr-2"></i>未找到匹配玩家</div>`;
        return;
    }
    renderNextBatch();
}

function renderNextBatch() {
    const container = document.getElementById("playerTableBody");
    const end = Math.min(renderedCount + BATCH_SIZE, filteredCache.length);
    const oldSentinel = document.getElementById('loadMoreSentinel');
    if (oldSentinel) oldSentinel.remove();

    let html = '';
    for (let i = renderedCount; i < end; i++) {
        const item = filteredCache[i];
        const realRank = rankMap.has(item.id) ? rankMap.get(item.id) : (i + 1);
        html += renderPlayerRow(item, realRank);
    }
    container.insertAdjacentHTML('beforeend', html);
    hydrateAvatars(container);
    renderedCount = end;

    if (renderedCount < filteredCache.length) {
        const sentinel = document.createElement('div');
        sentinel.id = 'loadMoreSentinel';
        sentinel.className = 'load-more-hint';
        sentinel.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>正在加载更多玩家...`;
        container.appendChild(sentinel);
        observeSentinel();
    }
}

function observeSentinel() {
    const sentinel = document.getElementById('loadMoreSentinel');
    if (!sentinel) return;
    if (sentinelObserver) sentinelObserver.disconnect();
    sentinelObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                if (sentinelObserver) sentinelObserver.disconnect();
                setTimeout(() => renderNextBatch(), 30);
            }
        });
    }, { rootMargin: '300px' });
    sentinelObserver.observe(sentinel);
}

function renderModePage(mode) {
    const container = document.getElementById("playerTableBody");
    if (sentinelObserver) { sentinelObserver.disconnect(); sentinelObserver = null; }
    if (modeColObserver) { modeColObserver.disconnect(); modeColObserver = null; }

    const fullData = playerList.filter(item => item && item.name).map(item => {
        const rawTotal = calcTotal(item);
        return { ...item, total: Math.max(0, rawTotal) };
    });
    fullData.sort((a, b) => b.total - a.total);

    const filterData = applySearch(fullData);
    modeRenderCtx = { mode, filterData };

    const tierIcons = {
        1: 'https://mctiers.gg/icons/tier_1.svg',
        2: 'https://mctiers.gg/icons/tier_2.svg',
        3: 'https://mctiers.gg/icons/tier_3.svg'
    };

    let columnsHtml = '';
    [1, 2, 3, 4, 5].forEach(tierNum => {
        columnsHtml += `
            <div class="mode-col">
                <div class="mode-col-header" role="columnheader"
                     style="background-color: var(--tier-${tierNum}); color: var(--tier-${tierNum}-foreground);">
                    ${tierIcons[tierNum] ? `<img class="object-contain" width="32" height="32" alt="${tierNum} icon" src="${tierIcons[tierNum]}" loading="lazy">` : ''}
                    Tier ${tierNum}
                </div>
                <div class="mode-col-body" data-tier-col="${tierNum}" style="min-height: 80px;"></div>
            </div>`;
    });

    const participantCount = filterData.filter(p => getModeTier(p, mode) !== '-').length;
    const modeLabel = MODE_LABELS[mode] || mode;

    container.innerHTML = `
        <div class="mode-page-wrapper">
            <div class="flex justify-between items-center gap-3 mb-4 flex-wrap px-1">
                <h3 class="text-xl font-black text-white flex items-center gap-2">
                    ${buildModeIconHtml(mode, { size: 28, cls: 'object-contain' })}
                    ${escapeHtml(modeLabel)} Tier Ranking
                </h3>
                <span class="text-sm text-muted-foreground">共 ${participantCount} 位玩家上榜</span>
            </div>
            <div class="overflow-x-auto">

                    ${columnsHtml}
                </div>

        </div>`;

    const bodies = container.querySelectorAll('.mode-col-body[data-tier-col]');
    if (typeof IntersectionObserver === 'undefined') {
        bodies.forEach(b => fillModeColumn(b, Number(b.dataset.tierCol)));
        return;

            if (!entry.isIntersecting) return;

            fillModeColumn(entry.target, Number(entry.target.dataset.tierCol));

    bodies.forEach(b => modeColObserver.observe(b));
}

function fillModeColumn(body, tierNum) {
    if (!body || !modeRenderCtx) return;
    if (body.dataset.filled === '1') return;
    body.dataset.filled = '1';

    const { mode, filterData } = modeRenderCtx;
    const players = getTierBucketPlayers(filterData, mode, tierNum);

    if (!players.length) {
        body.innerHTML = '<div class="mode-empty">暂无玩家</div>';
        return;
    }

    let rowsHtml = '';
    players.forEach(p => {
        const tierVal = getModeTier(p, mode);

        const regionColor = getRegionColor(region);

    hydrateAvatars(body);
}

async function loadAllPlayers() {
    try {
        const PAGE_SIZE = 200;
        let page = 1;
        let allPlayers = [];
        let total = null;

        while (true) {
            const res = await fetch(`${API_BASE}/api/players?page=${page}&limit=${PAGE_SIZE}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            let batch = [];
            if (Array.isArray(data)) {
                batch = data;
                total = batch.length;
            } else if (Array.isArray(data.players)) {
                batch = data.players;
                total = typeof data.total === 'number' ? data.total : batch.length;
            } else if (data.data && Array.isArray(data.data.players)) {
                batch = data.data.players;
                total = typeof data.data.total === 'number' ? data.data.total : batch.length;
            } else if (data.data && Array.isArray(data.data)) {
                batch = data.data;
                total = batch.length;
            } else if (data.success === false) {
                throw new Error(data.msg || data.message || "加载失败");
            }

            allPlayers = allPlayers.concat(batch);

            if (allPlayers.length >= total || batch.length < PAGE_SIZE) break;

            page++;
            if (page > 50) break;
        }

        playerList = allPlayers;
        renderTable();
    } catch (err) {
        document.getElementById("playerTableBody").innerHTML =
            `<div class="empty-tip">⚠️ 加载失败：${escapeHtml(err.message)}</div>`;
    }
}

function showToast(msg, type = 'success') {
    const toast = document.createElement('div');
    const bg = type === 'error' ? 'rgba(255,101,104,0.95)' : 'rgba(30,41,57,0.98)';
    const border = type === 'error' ? 'rgba(255,101,104,0.5)' : 'rgba(155,187,245,0.35)';
    toast.style.cssText = `position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(8px);background:${bg};color:#fff;padding:0.8rem 1.6rem;border-radius:0.7rem;z-index:9999;border:1px solid ${border};font-weight:600;font-size:0.9rem;box-shadow:0 8px 28px rgba(0,0,0,0.45);opacity:0;transition:opacity 0.25s ease, transform 0.25s ease;max-width:90vw;word-break:break-all;`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
    });
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(8px)';
        setTimeout(() => toast.remove(), 300);
    }, 1600);
}

async function copyToClipboard(text, successMsg) {
    let success = false;

    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        try {
            await navigator.clipboard.writeText(text);
            success = true;
        } catch (e) { console.warn('[clipboard] writeText 失败:', e && e.message); }
    }

    if (!success) {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '0'; ta.style.left = '0';
            ta.style.width = '2em'; ta.style.height = '2em';
            ta.style.padding = '0'; ta.style.border = 'none';
            ta.style.outline = 'none'; ta.style.boxShadow = 'none';
            ta.style.background = 'transparent';
            ta.style.opacity = '0'; ta.style.zIndex = '-1';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            if (typeof ta.setSelectionRange === 'function') ta.setSelectionRange(0, ta.value.length);
            success = document.execCommand('copy');
            document.body.removeChild(ta);
        } catch (e) { console.warn('[clipboard] execCommand 失败:', e && e.message); success = false; }
    }

    if (success) { showToast(successMsg || '已复制到剪贴板'); return true; }
    else {
        showToast('自动复制失败，请手动复制', 'error');
        try { window.prompt('请手动复制以下内容（Ctrl+C / 长按选择）：', text); } catch (_) {}
        return false;
    }
}

    document.addEventListener('click', (e) => {
        if (!navMenu.classList.contains('open')) return;
        if (navMenu.contains(e.target) || navToggleBtn.contains(e.target)) return;
        setNavMenuOpen(false);
    });

    navMenu.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => setNavMenuOpen(false));
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (window.innerWidth >= 768) {
                const wasOpen = navMenu.classList.contains('open');
                navMenu.classList.remove('open');
                document.body.style.overflow = '';
                navToggleBtn.setAttribute('aria-expanded', 'false');
                if (wasOpen) {
                    navToggleBtn.innerHTML = '<i class="fa-solid fa-bars text-lg"></i>';
                }
            }
        }, 120);
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && navMenu.classList.contains('open')) {
            setNavMenuOpen(false);
        }
    });
}

function bindEvents() {
    initGlobalTooltipEvents();
    initTierInfoTabs();
    initMobileNav();

    safeBind("closeDetail", "click", closeDetail);
    safeBind("detailModal", "click", e => { if (e.target === e.currentTarget) closeDetail(); });

    safeBind("detailCopyIdBtn", "click", async (e) => {
        e.stopPropagation();
        if (!currentViewPlayer) return;
        const apiData = JSON.stringify(currentViewPlayer, null, 2);
        const name = cleanPlayerName(currentViewPlayer.name);
        await copyToClipboard(apiData, `已复制 ${name} 的API数据`);
    });

    document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
            closeDetail();
            closeTierInfoModal();
            hideTierTooltip();
            setNavMenuOpen(false);
        }
        if (e.key === "/" && document.activeElement !== document.getElementById('searchBox')) {
            e.preventDefault();
            document.getElementById('searchBox').focus();
        }
    });

    safeBind("searchBox", "input", e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            searchKeyword = e.target.value;
            renderTable();
        }, 200);
    });

    safeBind("tierInfoBtn", "click", openTierInfoModal);
    safeBind("closeTierInfo", "click", closeTierInfoModal);
    safeBind("closeTierInfoBtn", "click", closeTierInfoModal);
    safeBind("tierInfoModal", "click", e => { if (e.target === e.currentTarget) closeTierInfoModal(); });

    safeBind("playerTableBody", "click", (e) => {
        const row = e.target.closest('.player-row');
        const modeRow = e.target.closest('.mode-row');
        const target = row || modeRow;
        if (!target) return;
        const id = Number(target.dataset.id);
        const player = playerList.find(p => p.id === id);
        if (player) openDetail(player);
    });
}

document.addEventListener('DOMContentLoaded', () => {
    initAvatarObserver();
    buildTierTabs();
    bindEvents();
    loadAllPlayers();
});
</script>
</body>
